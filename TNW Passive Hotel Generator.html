<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CT Hotel Passive Command Generator</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --ct-pink: #ff2e5f; --ct-teal: #00434e; --ct-lpink: #fcd5df; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f0f0; color: #1a1a1a; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 1.5rem; }
  .app { width: 100%; max-width: 580px; }
  .header { background: var(--ct-teal); color: #fff; border-radius: 8px 8px 0 0; padding: .6rem 1rem; display: flex; align-items: center; gap: 8px; }
  .ct-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ct-pink); flex-shrink: 0; }
  .header-title { font-size: 13px; font-weight: 600; color: #fff; letter-spacing: .01em; }
  .card { background: #fff; border: 1px solid #d8d8d8; border-top: none; padding: .875rem 1rem 1rem; border-radius: 0 0 8px 8px; }
  .sec { margin-bottom: .75rem; }
  .sec-title { font-size: 10px; font-weight: 700; color: var(--ct-teal); text-transform: uppercase; letter-spacing: .07em; margin-bottom: .45rem; padding-bottom: .25rem; border-bottom: 2px solid var(--ct-lpink); }
  .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .g4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; }
  .g5 { display: grid; grid-template-columns: 2fr 1fr 2fr 1fr 2fr; gap: 8px; align-items: end; }
  .field { display: flex; flex-direction: column; gap: 2px; }
  .nights-sep { text-align: center; font-size: 11px; color: #aaa; padding-bottom: 6px; }
  label { font-size: 11px; color: #666; }
  input, select { font-family: inherit; font-size: 12px; padding: 5px 8px; border: 1px solid #ccc; border-radius: 5px; background: #fff; color: #1a1a1a; outline: none; width: 100%; transition: border-color .15s; }
  input:focus, select:focus { border-color: var(--ct-teal); }
  .ac-wrap { position: relative; }
  .ac-list { position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid #bbb; border-radius: 5px; z-index: 200; max-height: 170px; overflow-y: auto; margin-top: 1px; box-shadow: 0 3px 10px rgba(0,0,0,.1); }
  .ac-item { padding: 6px 10px; cursor: pointer; border-bottom: .5px solid #f0f0f0; font-size: 12px; }
  .ac-item:last-child { border-bottom: none; }
  .ac-item:hover { background: var(--ct-lpink); }
  .ac-name { font-weight: 500; color: #1a1a1a; }
  .ac-meta { font-size: 10px; color: #888; margin-top: 1px; }
  .divider { border: none; border-top: 1px solid #efefef; margin: .75rem 0; }
  .bottom { display: none; }
  .bottom.visible { display: block; }
  .lock-hint { font-size: 11px; color: #999; text-align: center; padding: .4rem 0 .1rem; display: none; font-style: italic; }
  .lock-hint.visible { display: block; }
  .out-label { font-size: 11px; font-weight: 600; color: var(--ct-teal); margin-bottom: 3px; display: flex; align-items: center; gap: 5px; }
  .step-badge { background: var(--ct-pink); color: #fff; border-radius: 50%; width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; flex-shrink: 0; }
  .out-box { background: #f8f8f8; border: 1px solid #e0e0e0; border-radius: 5px; padding: .5rem .75rem; font-family: 'Courier New', Courier, monospace; font-size: 11px; color: #1a1a1a; word-break: break-all; line-height: 1.6; min-height: 38px; white-space: pre-wrap; margin-bottom: .375rem; }
  .copy-btn { width: 100%; padding: 7px; font-size: 12px; font-weight: 700; cursor: pointer; border-radius: 5px; border: none; background: var(--ct-pink); color: #fff; letter-spacing: .02em; transition: opacity .15s; }
  .copy-btn:hover { opacity: .85; }
  .copy-btn:active { transform: scale(.98); }
  .copy-btn.done { background: var(--ct-teal); }
  .warn { font-size: 10px; color: #b05000; margin-top: 2px; }
  .cmd-gap { margin-top: .625rem; }

  @media (max-width: 500px) {
    .g4 { grid-template-columns: 1fr 1fr; }
    .g5 { grid-template-columns: 1fr 1fr; }
    .g5 .nights-sep { display: none; }
    .g2 { grid-template-columns: 1fr; }
    body { padding: .75rem; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="ct-dot"></div>
    <span class="header-title">Hotel passive command generator</span>
  </div>
  <div class="card">

    <div class="sec">
      <div class="sec-title">Hotel</div>
      <div class="field" style="margin-bottom:7px">
        <label>Hotel name</label>
        <div class="ac-wrap">
          <input type="text" id="hotelInput" placeholder="Start typing hotel name..." autocomplete="off" oninput="filterHotels()" onblur="hideAC('hotelAC')">
          <div class="ac-list" id="hotelAC" style="display:none"></div>
        </div>
      </div>
      <div class="g4">
        <div class="field">
          <label>City code</label>
          <input type="text" id="cityCode" placeholder="HBA" oninput="this.value=this.value.toUpperCase();checkReveal()">
        </div>
        <div class="field">
          <label>Provider</label>
          <input type="text" id="providerCode" placeholder="SALHBA" oninput="this.value=this.value.toUpperCase();checkReveal()">
        </div>
        <div class="field">
          <label>CRS</label>
          <select id="crsSource" onchange="checkReveal()">
            <option value="HOTELDIR">HOTELDIR</option>
            <option value="EAN">EAN</option>
            <option value="THN">THN</option>
            <option value="BOO">BOO</option>
            <option value="AIRNBN">AIRNBN</option>
          </select>
        </div>
        <div class="field">
          <label>Rooms</label>
          <input type="number" id="rooms" value="1" min="1" max="9" oninput="checkReveal()">
        </div>
      </div>
    </div>

    <div class="sec">
      <div class="sec-title">Stay &amp; rate</div>
      <div class="g5" style="margin-bottom:8px">
        <div class="field">
          <label>Check-in</label>
          <input type="date" id="checkin" oninput="onCheckinChange()">
        </div>
        <div class="field">
          <label>Nights</label>
          <input type="number" id="nights" min="1" max="365" placeholder="0" oninput="onNightsChange()">
        </div>
        <div class="field">
          <label>Check-out</label>
          <input type="date" id="checkout" oninput="onCheckoutChange()">
        </div>
        <div class="nights-sep"></div>
        <div class="field">
          <label>Rate / room</label>
          <input type="number" id="rate" placeholder="150.00" step="0.01" min="0" oninput="checkReveal()">
        </div>
      </div>
      <div style="display:flex;gap:8px;align-items:flex-end">
        <div class="field" style="width:130px">
          <label>Currency</label>
          <select id="currency" onchange="checkReveal()">
            <option value="AUD">AUD</option>
            <option value="NZD">NZD</option>
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
            <option value="GBP">GBP</option>
          </select>
        </div>
        <div class="field" style="width:100px">
          <label>Room type</label>
          <input type="text" id="roomType" value="STD" oninput="this.value=this.value.toUpperCase();checkReveal()">
        </div>
      </div>
    </div>

    <div class="lock-hint" id="lockHint">Complete the fields above to continue &darr;</div>

    <div class="bottom" id="bottomHalf">
      <div class="divider"></div>

      <div class="sec">
        <div class="sec-title">Booker &amp; guarantee</div>
        <div class="g2" style="margin-bottom:7px">
          <div class="field">
            <label>Travel booker</label>
            <div class="ac-wrap">
              <input type="text" id="bookerInput" placeholder="Start typing name..." autocomplete="off" oninput="filterBookers()" onblur="hideAC('bookerAC')">
              <div class="ac-list" id="bookerAC" style="display:none"></div>
            </div>
            <div class="warn" id="cardNote" style="display:none"></div>
          </div>
          <div class="field">
            <label>Chargeback inclusions</label>
            <select id="siOption" onchange="buildCommand()">
              <option value="">-- Select booker first --</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label>Guarantee card <span style="font-size:10px;color:#aaa">(auto-filled — editable)</span></label>
          <input type="text" id="gCard" placeholder="Auto-filled from booker" oninput="buildCommand()">
        </div>
      </div>

      <div class="sec">
        <div class="sec-title">Confirmation</div>
        <div class="field">
          <label>Confirmation number</label>
          <input type="text" id="cfNumber" placeholder="Hotel confirmation number" oninput="this.value=this.value.toUpperCase();buildCommand()">
        </div>
      </div>

      <div class="divider"></div>

      <div>
        <div class="out-label"><span class="step-badge">1</span>Passive hotel command — enter first, then press Enter in Sabre</div>
        <div class="out-box" id="output1">Complete all fields to generate.</div>
        <button class="copy-btn" id="copyBtn1" onclick="copyCmd(1)">Copy command 1</button>
      </div>

      <div class="cmd-gap">
        <div class="out-label"><span class="step-badge">2</span>L&yen;VP line — enter after pressing Enter</div>
        <div class="out-box" id="output2">Complete all fields to generate.</div>
        <button class="copy-btn" id="copyBtn2" onclick="copyCmd(2)">Copy command 2</button>
      </div>
    </div>

  </div>
</div>

<script>
/*
=============================================================
  MASTER LIST — edit this section to add/update data
=============================================================

  HOTELS: add a new entry like this:
    {name:"Hotel Name", city:"CCC", provider:"PROVCODE"},

    {
      name:"FULL NAME IN CAPS",
      card:"VI4715********XXXX/EXPMMYY",   // use null if no card

        {label:"Room bond and parking", value:"FULL NAME ROOM BOND AND PARKING"},

  {name:"Beachfront Bicheno", city:"HLS", provider:"BICBIC"},
  {name:"Tasman Holiday Parks St Helens", city:"HLS", provider:"NRMHLS"},
  {name:"Strahan Village", city:"LST", provider:"LSTSV1"},

  {name:"Tullah Lakeside Lodge", city:"UEE", provider:"TLCBWT"}

const BOOKERS = [
  {name:"ABBY HAY", card:"VI4715********9821/EXP0929", si:[{label:"Room bond and parking",value:"ABBY HAY ROOM BOND AND PARKING"},{label:"Room meals bond parking",value:"ABBY HAY ROOM MEALS BOND PARKING"}]},
  {name:"BRANDI SOKOLSKI", card:"VI4715********0293/EXP0529", si:[{label:"Room bond and parking",value:"BRANDI SOKOLSKI ROOM BOND AND PARKING"},{label:"Room meals bond and parking",value:"BRANDI SOKOLSKI ROOM MEALS BOND AND PARKING"}]},
  {name:"BRIDGET BUGG", card:"VI4715********9201/EXP0726", si:[{label:"Room meals bond parking",value:"BRIDGET BUGG ROOM MEALS BOND PARKING"},{label:"Room bond and parking",value:"BRIDGET BUGG ROOM BOND AND PARKING"}]},
  {name:"CHELSEA TOPIA", card:"VI4715********2627/EXP0628", si:[{label:"Room bond and parking",value:"CHELSEA TOPIA ROOM BOND AND PARKING"},{label:"Room meals bond parking",value:"CHELSEA TOPIA ROOM MEALS BOND PARKING"}]},
  {name:"CHLOE VAROVCIC", card:"VI4715********8920/EXP0329", si:[{label:"Room meals bond parking",value:"CHLOE VAROVCIC ROOM MEALS BOND PARKING"},{label:"Room bond and parking",value:"CHLOE VAROVCIC ROOM BOND AND PARKING"}]},
  {name:"CINDY LEWIS BRYAN", card:"VI4715********7215/EXP0328", si:[{label:"Room bond and parking",value:"CINDY LEWIS BRYAN ROOM BOND AND PARKING"},{label:"Room meals bond and parking",value:"CINDY LEWIS BRYAN ROOM MEALS BOND AND PARKING"}]},
  {name:"COLETTE GOODMAN", card:"VI4715********2544/EXP1128", si:[{label:"Room meals bond parking",value:"COLETTE GOODMAN ROOM MEALS BOND PARKING"},{label:"Room bond and parking",value:"COLETTE GOODMAN ROOM BOND AND PARKING"}]},
  {name:"EMILY FRERK", card:"VI4715********5228/EXP0128", si:[{label:"Room bond and parking",value:"EMILY FRERK ROOM BOND AND PARKING"},{label:"Room meals bond and parking",value:"EMILY FRERK ROOM MEALS BOND AND PARKING"}]},
  {name:"EMMA NICHOLS", card:"VI4715********5756/EXP1228", si:[{label:"Room bond and parking",value:"EMMA NICHOLS ROOM BOND AND PARKING"},{label:"Room meals bond and parking",value:"EMMA NICHOLS ROOM MEALS BOND AND PARKING"}]},
  {name:"GAIL JEPSON", card:"VI4715********7673/EXP0827", si:[{label:"Room bond and parking",value:"GAIL JEPSON ROOM BOND AND PARKING"},{label:"Room meals bond and parking",value:"GAIL JEPSON ROOM MEALS BOND AND PARKING"}]},
  {name:"JODI REDPATH", card:"VI4715********0237/EXP0826", si:[{label:"Room bond and parking",value:"JODI REDPATH ROOM BOND AND PARKING"},{label:"Room meals bond parking",value:"JODI REDPATH ROOM MEALS BOND PARKING"}]},
  {name:"KAIDY LAGEREWSKIJ", card:"VI4715********6535/EXP0726", si:[{label:"Room bond and parking",value:"KAIDY LAGEREWSKIJ ROOM BOND AND PARKING"},{label:"Room meals bond parking",value:"KAIDY LAGEREWSKIJ ROOM MEALS BOND PARKING"}]},
  {name:"KELLY DANIELS", card:"VI4715********5153/EXP0329", si:[{label:"Room bond and parking",value:"KELLY DANIELS ROOM BOND AND PARKING"},{label:"Room meals bond parking",value:"KELLY DANIELS ROOM MEALS BOND PARKING"}]},
  {name:"LAUREN NICOLLE", card:"VI4715********7166/EXP0626", si:[{label:"Room bond and parking",value:"LAUREN NICOLLE ROOM BOND AND PARKING"},{label:"Room meals bond parking",value:"LAUREN NICOLLE ROOM MEALS BOND PARKING"}]},
  {name:"MICHELE PERCY", card:"VI4715********7174/EXP0726", si:[{label:"Room meals bond parking",value:"MICHELE PERCY ROOM MEALS BOND PARKING"},{label:"Room bond and parking",value:"MICHELE PERCY ROOM BOND AND PARKING"}]},
  {name:"PAYING OWN ACCOUNT", card:null, si:[{label:"Paying own account during stay",value:"PAYING OWN ACCOUNT DURING STAY"}]},
  {name:"SARAH GREAVES", card:"VI4715********3097/EXP0227", si:[{label:"Room bond and parking",value:"SARAH GREAVES ROOM BOND AND PARKING"},{label:"Room meals bond parking",value:"SARAH GREAVES ROOM MEALS BOND PARKING"}]},
  {name:"TANYA BENNETT", card:"VI4715********8431/EXP1226", si:[{label:"Room bond and parking",value:"TANYA BENNETT ROOM BOND AND PARKING"},{label:"Room meals bond and parking",value:"TANYA BENNETT ROOM MEALS BOND AND PARKING"}]},
  {name:"TERSIA DERCKSEN", card:"VI4715********8415/EXP1026", si:[{label:"Room bond and parking",value:"TERSIA DERCKSEN ROOM BOND AND PARKING"},{label:"Room meals bond parking",value:"TERSIA DERCKSEN ROOM MEALS BOND PARKING"}]}
];

/* =============================================================
   END OF MASTER LIST — do not edit below this line
============================================================= */

let selectedBooker = null;

function dateToISO(d) {
  if (!d) return null;
  const p = d.split('-');
  return p.length === 3 ? d : null;
}

function addDays(isoDate, n) {
  const d = new Date(isoDate + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().split('T')[0];
}

function diffDays(isoA, isoB) {
  const a = new Date(isoA + 'T00:00:00');
  const b = new Date(isoB + 'T00:00:00');
  return Math.round((b - a) / 86400000);
}

function onCheckinChange() {
  const ci = document.getElementById('checkin').value;
  const co = document.getElementById('checkout').value;
  const n = parseInt(document.getElementById('nights').value);
  if (ci && n > 0) {
    document.getElementById('checkout').value = addDays(ci, n);
  } else if (ci && co) {
    const diff = diffDays(ci, co);
    if (diff > 0) document.getElementById('nights').value = diff;
  }
  checkReveal();
}

function onNightsChange() {
  const ci = document.getElementById('checkin').value;
  const n = parseInt(document.getElementById('nights').value);
  if (ci && n > 0) {
    document.getElementById('checkout').value = addDays(ci, n);
  }
  checkReveal();
}

function onCheckoutChange() {
  const ci = document.getElementById('checkin').value;
  const co = document.getElementById('checkout').value;
  if (ci && co) {
    const diff = diffDays(ci, co);
    if (diff > 0) document.getElementById('nights').value = diff;
  }
  checkReveal();
}

function filterHotels() {
  const val = document.getElementById('hotelInput').value.toLowerCase();
  const ac = document.getElementById('hotelAC');
  if (val.length < 2) { ac.style.display = 'none'; return; }
  const m = HOTELS.filter(h => h.name.toLowerCase().includes(val));
  if (!m.length) { ac.style.display = 'none'; return; }
  ac.innerHTML = '';
  m.forEach(h => {
    const d = document.createElement('div');
    d.className = 'ac-item';
    d.innerHTML = `<div class="ac-name">${h.name}</div><div class="ac-meta">${h.city} &middot; ${h.provider}</div>`;
    d.onmousedown = () => selectHotel(h);
    ac.appendChild(d);
  });
  ac.style.display = 'block';
}

function selectHotel(h) {
  document.getElementById('hotelInput').value = h.name;
  document.getElementById('cityCode').value = h.city;
  document.getElementById('providerCode').value = h.provider;
  document.getElementById('hotelAC').style.display = 'none';
  checkReveal();
}

function filterBookers() {
  const val = document.getElementById('bookerInput').value.toLowerCase();
  const ac = document.getElementById('bookerAC');
  if (val.length < 2) { ac.style.display = 'none'; return; }
  const m = BOOKERS.filter(b => b.name.toLowerCase().includes(val));
  if (!m.length) { ac.style.display = 'none'; return; }
  ac.innerHTML = '';
  m.forEach(b => {
    const d = document.createElement('div');
    d.className = 'ac-item';
    d.innerHTML = `<div class="ac-name">${b.name}</div>`;
    d.onmousedown = () => selectBooker(b);
    ac.appendChild(d);
  });
  ac.style.display = 'block';
}

function selectBooker(b) {
  selectedBooker = b;
  document.getElementById('bookerInput').value = b.name;
  document.getElementById('bookerAC').style.display = 'none';
  const siSel = document.getElementById('siOption');
  const cardInput = document.getElementById('gCard');
  const note = document.getElementById('cardNote');
  siSel.innerHTML = '';
  note.style.display = 'none';
  const isPaying = b.name === 'PAYING OWN ACCOUNT';
  if (isPaying) {
    cardInput.value = '';
    cardInput.placeholder = 'N/A — guest pays own account';
  } else {
    cardInput.value = b.card || '';
    cardInput.placeholder = b.card ? 'Auto-filled or enter manually' : 'No card on file — enter manually';
    if (!b.card) { note.textContent = 'No card on file for this booker'; note.style.display = 'block'; }
  }
  if (b.si && b.si.length > 0) {
    b.si.forEach(s => {
      const o = document.createElement('option');
      o.value = s.value; o.textContent = s.label;
      siSel.appendChild(o);
    });
  } else {
    const o = document.createElement('option');
    o.value = ''; o.textContent = 'No SI options — add to master list';
    siSel.appendChild(o);
    note.textContent = (note.style.display === 'block' ? note.textContent + ' · ' : '') + 'No SI options configured';
    note.style.display = 'block';
  }
  buildCommand();
}

function hideAC(id) {
  setTimeout(() => { document.getElementById(id).style.display = 'none'; }, 150);
}

function topComplete() {
  const hotel = document.getElementById('hotelInput').value.trim();
  const city = document.getElementById('cityCode').value.trim();
  const provider = document.getElementById('providerCode').value.trim();
  const checkin = document.getElementById('checkin').value;
  const checkout = document.getElementById('checkout').value;
  const roomType = document.getElementById('roomType').value.trim();
  const rate = parseFloat(document.getElementById('rate').value);
  return hotel && city && provider && checkin && checkout && roomType && rate > 0;
}

function checkReveal() {
  const bottom = document.getElementById('bottomHalf');
  const hint = document.getElementById('lockHint');
  if (topComplete()) {
    bottom.classList.add('visible');
    hint.classList.remove('visible');
  } else {
    bottom.classList.remove('visible');
    hint.classList.add('visible');
  }
  buildCommand();
}

function fmtDate(d) {
  if (!d) return '';
  const [y, m, day] = d.split('-');
  const mo = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  return day + mo[parseInt(m) - 1];
}

function buildCommand() {
  if (!topComplete()) return;
  const rooms = parseInt(document.getElementById('rooms').value) || 1;
  const city = document.getElementById('cityCode').value.toUpperCase();
  const checkin = fmtDate(document.getElementById('checkin').value);
  const checkout = fmtDate(document.getElementById('checkout').value);
  const hotel = document.getElementById('hotelInput').value.toUpperCase();
  const roomType = document.getElementById('roomType').value.toUpperCase();
  const rate = parseFloat(document.getElementById('rate').value) || 0;
  const currency = document.getElementById('currency').value;
  const provider = document.getElementById('providerCode').value.toUpperCase();
  const crs = document.getElementById('crsSource').value;
  const si = document.getElementById('siOption').value.toUpperCase();
  const isPaying = selectedBooker && selectedBooker.name === 'PAYING OWN ACCOUNT';
  const gCard = isPaying ? '' : document.getElementById('gCard').value.toUpperCase();
  const cf = document.getElementById('cfNumber').value.toUpperCase();
  const totalRate = (rate * rooms).toFixed(2);

  const missing = [];
  if (!si) missing.push('SI option');
  if (!isPaying && !gCard) missing.push('guarantee card');
  if (!cf) missing.push('confirmation number');

  if (missing.length) {
    document.getElementById('output1').textContent = 'Still needed: ' + missing.join(', ') + '.';
    document.getElementById('output2').textContent = 'Complete all fields to generate.';
    return;
  }

  const gPart = isPaying ? '' : `/G-${gCard}`;
  const line1 = `0HHTYYGK${rooms}${city}IN${checkin}-OUT${checkout}/${hotel}/${roomType}/${totalRate}${currency}/W-${provider}/CRS-${crs}/SI-${si}${gPart}/CF-${cf}`;
  const line2 = `L\u00A5VP-${si}/HTL-${cf}`;
  document.getElementById('output1').textContent = line1;
  document.getElementById('output2').textContent = line2;
}

function copyCmd(n) {
  const text = document.getElementById('output' + n).textContent;
  if (!text || text.startsWith('Still') || text.startsWith('Complete')) return;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn' + n);
    const orig = btn.textContent;
    btn.textContent = 'Copied!';
    btn.classList.add('done');
    setTimeout(() => { btn.textContent = orig; btn.classList.remove('done'); }, 2000);
  });
}

checkReveal();
</script>
</body>
</html>
